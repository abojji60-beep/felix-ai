name: Build Felix AI Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Full Felix Studio Project
        run: |
          mkdir -p app/src/main/java/com/felix/app
          mkdir -p app/src/main/res/values
          
          echo "rootProject.name = 'FelixApp'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.felix.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.felix.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Felix AI Studio" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/felix/app/MainActivity.kt <<'EOF'
          package com.felix.app
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B132B")) // لون داكن احترافي
                      setPadding(50, 100, 50, 50)
                  }

                  val logo = TextView(this).apply {
                      text = "Felix AI Studio"
                      textSize = 32f
                      setTextColor(Color.parseColor("#00E5FF")) // لون سماوي
                      gravity = Gravity.CENTER
                  }

                  val desc = TextView(this).apply {
                      text = "بيئة تطوير تطبيقات بالذكاء الاصطناعي\n\nهذا APK حقيقي، وسيتم تفعيل الذكاء الاصطناعي في التحديث القادم."
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 50, 0, 50)
                  }

                  val editorBox = TextView(this).apply {
                      text = "// اكتب وصف التطبيق هنا...\n// الذكاء الاصطناعي سيكتب الكود لك"
                      textSize = 14f
                      setTextColor(Color.parseColor("#00FF9D"))
                      setBackgroundColor(Color.parseColor("#1C2541"))
                      setPadding(30, 30, 30, 30)
                  }

                  val btn = Button(this).apply {
                      text = "توليد التطبيق (قريباً)"
                      setBackgroundColor(Color.parseColor("#00E5FF"))
                      setTextColor(Color.BLACK)
                  }

                  layout.addView(logo)
                  layout.addView(desc)
                  layout.addView(editorBox)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Felix-AI-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
