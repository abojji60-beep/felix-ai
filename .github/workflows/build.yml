name: Felix AI Studio Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/felix/app
          echo "rootProject.name = 'FelixApp'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          
      - name: Create App Gradle
        run: |
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.felix.app'; compileSdk 34; defaultConfig { applicationId 'com.felix.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }; buildTypes { release { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }" >> app/build.gradle

      - name: Create Manifest and Code
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="Felix Studio" android:theme="@style/Theme.AppCompat.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          echo 'package com.felix.app; import android.graphics.Color; import android.os.Bundle; import android.view.Gravity; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); LinearLayout layout = new LinearLayout(this); layout.setOrientation(LinearLayout.VERTICAL); layout.setGravity(Gravity.CENTER); layout.setBackgroundColor(Color.parseColor("#0B132B")); TextView title = new TextView(this); title.setText("Felix AI Studio"); title.setTextSize(30); title.setTextColor(Color.parseColor("#00E5FF")); title.setGravity(Gravity.CENTER); TextView sub = new TextView(this); sub.setText("مرحباً بك في بيئة تطوير التطبيقات بالذكاء الاصطناعي\n\nAPK حقيقي 100%"); sub.setTextSize(16); sub.setTextColor(Color.WHITE); sub.setGravity(Gravity.CENTER); sub.setPadding(0, 50, 0, 0); layout.addView(title); layout.addView(sub); setContentView(layout); } }' > app/src/main/java/com/felix/app/MainActivity.java

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Felix-Studio-App
          path: app/build/outputs/apk/debug/*.apk
